<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <style>
        :root {
            --radium: #00ffaa;
            --radium-dark: #00cc88;
            --radium-glow: 0 0 15px rgba(0, 255, 170, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(-45deg, #111, #222, #111, #333);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            z-index: -1;
            opacity: 0.8;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 450px;
            background: rgba(20, 20, 25, 0.85);
            border-radius: 20px;
            box-shadow: var(--radium-glow), 0 0 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 255, 170, 0.15);
            animation: pulse 3s infinite alternate;
            z-index: 10;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 15px rgba(0, 255, 170, 0.5); }
            100% { box-shadow: 0 0 30px rgba(0, 255, 170, 0.8); }
        }

        .form-container {
            position: relative;
            width: 100%;
            padding: 40px;
            transition: all 0.6s ease-in-out;
        }

        .title {
            font-size: 28px;
            color: var(--radium);
            margin-bottom: 20px;
            font-weight: 700;
            text-align: center;
            text-shadow: 0 0 10px rgba(0, 255, 170, 0.5);
            letter-spacing: 1px;
        }

        .error {
            color: #ff5555;
            font-size: 14px;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 5px rgba(255, 85, 85, 0.5);
        }

        .input-field {
            position: relative;
            height: 50px;
            width: 100%;
            margin-top: 20px;
            background: rgba(30, 30, 35, 0.8);
            border-radius: 10px;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 1px solid rgba(0, 255, 170, 0.1);
        }

        .input-field:hover {
            border-color: var(--radium);
            box-shadow: var(--radium-glow);
        }

        .input-field input {
            height: 100%;
            width: 100%;
            padding: 0 45px;
            border: none;
            outline: none;
            font-size: 16px;
            background: transparent;
            color: #fff;
        }

        .input-field input::placeholder {
            color: #aaa;
        }

        .input-field i {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            color: var(--radium);
            font-size: 20px;
            left: 15px;
            text-shadow: 0 0 8px rgba(0, 255, 170, 0.7);
        }

        .input-field .show-hide {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--radium);
            font-size: 18px;
            cursor: pointer;
            padding: 5px;
            text-shadow: 0 0 5px rgba(0, 255, 170, 0.5);
        }

        .checkbox-text {
            display: flex;
            align-items: center;
            margin-top: 20px;
            font-size: 14px;
            color: #ccc;
        }

        .checkbox-text input {
            margin-right: 10px;
            accent-color: var(--radium);
        }

        .text {
            color: #aaa;
            font-size: 14px;
            margin-top: 25px;
            text-align: center;
        }

        .text a {
            color: var(--radium);
            text-decoration: none;
            font-weight: 600;
            text-shadow: 0 0 5px rgba(0, 255, 170, 0.5);
            transition: all 0.3s ease;
        }

        .text a:hover {
            color: #fff;
            text-shadow: 0 0 10px var(--radium);
        }

        .btn {
            margin-top: 30px;
            width: 100%;
            height: 50px;
            border: none;
            outline: none;
            border-radius: 10px;
            background: linear-gradient(45deg, var(--radium-dark), var(--radium));
            color: #111;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(0, 255, 170, 0.4);
            position: relative;
            overflow: hidden;
            letter-spacing: 1px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 30px rgba(0, 255, 170, 0.7);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn::before {
            content: "";
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.4),
                transparent
            );
            transition: 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .social-icons {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }

        .social-icons a {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(30, 30, 35, 0.8);
            color: var(--radium);
            margin: 0 10px;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 0 10px rgba(0, 255, 170, 0.2);
            border: 1px solid rgba(0, 255, 170, 0.1);
        }

        .social-icons a:hover {
            background: var(--radium);
            color: #111;
            transform: translateY(-5px) scale(1.1);
            box-shadow: 0 0 25px var(--radium);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid rgba(0, 255, 170, 0.2);
        }

        .divider-text {
            padding: 0 15px;
            color: var(--radium);
            font-size: 14px;
            text-shadow: 0 0 5px rgba(0, 255, 170, 0.3);
        }

        @media (max-width: 480px) {
            .container {
                max-width: 100%;
                margin: 0 20px;
            }

            .form-container {
                padding: 30px 20px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body>
    <div class="bg-animation"></div>
    <div class="container">
        <div class="form-container">
            <form action="{{ url_for('login') }}" method="POST" class="login-form" id="login-form">
                <h2 class="title">Login</h2>
                {% if error %}
                    <p class="error">{{ error }}</p>
                {% endif %}
                <div class="social-icons">
                    <a href="#" class="social-icon"><i class="fab fa-google"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social-icon"><i class="fab fa-apple"></i></a>
                </div>
                <div class="divider">
                    <span class="divider-text">or</span>
                </div>
                <div class="input-field">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" placeholder="Username" required />
                </div>
                <div class="input-field">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" id="login-password" placeholder="Password" required />
                    <span class="show-hide" onclick="togglePassword('login-password', this)">
                        <i class="fas fa-eye"></i>
                    </span>
                </div>
                <div class="checkbox-text">
                    <input type="checkbox" id="remember-me" />
                    <label for="remember-me">Remember me</label>
                    <a href="#" style="margin-left: auto">Forgot password?</a>
                </div>
                <button type="submit" class="btn">Login</button>
                <div class="text">
                    Don't have an account? <a href="{{ url_for('signup') }}">Sign Up</a>
                </div>
            </form>
        </div>
    </div>
    <script>
        function togglePassword(inputId, icon) {
            const input = document.getElementById(inputId);
            const eyeIcon = icon.querySelector("i");
            if (input.type === "password") {
                input.type = "text";
                eyeIcon.classList.remove("fa-eye");
                eyeIcon.classList.add("fa-eye-slash");
            } else {
                input.type = "password";
                eyeIcon.classList.remove("fa-eye-slash");
                eyeIcon.classList.add("fa-eye");
            }
        }
        function updateRadiumColor() {
            const hue = Math.sin(Date.now() / 5000) * 30 + 160;
            const radium = `hsl(${hue}, 100%, 50%)`;
            const radiumDark = `hsl(${hue}, 100%, 40%)`;
            document.documentElement.style.setProperty("--radium", radium);
            document.documentElement.style.setProperty("--radium-dark", radiumDark);
            document.documentElement.style.setProperty(
                "--radium-glow",
                `0 0 15px ${radium}7F`
            );
            requestAnimationFrame(updateRadiumColor);
        }
        updateRadiumColor();
    </script>
</body>
</html>
